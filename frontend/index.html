<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="验证调用树、时间边界，合并并行子区间，计算每段独占耗时并列出热点。 知华科技"
    />
    <title>知华模型调用链耗时分析 · 知华科技</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <strong>知华科技 <span>/</span> 模型调用链耗时分析</strong>
      <div id="account"></div>
    </header>
    <div id="notice" role="status" aria-live="polite"></div>
    <main id="login">
      <small>企业工作空间</small>
      <h1>登录工作台</h1>
      <p>推理性能排查 · 模型调用链耗时分析</p>
      <form id="signin">
        <label
          >账号<input name="username" autocomplete="username" required /></label
        ><label
          >密码<input
            type="password"
            name="password"
            autocomplete="current-password"
            required /></label
        ><button class="primary">登录</button>
      </form>
    </main>
    <div id="shell" hidden>
      <aside>
        <small>业务工作区</small><button id="entry">新建分析</button
        ><button id="ledger">结果台账</button
        ><small id="adminCaption" hidden>系统管理</small
        ><button id="accounts" hidden>账号与审计</button>
        <hr />
        <button id="security">修改我的密码</button>
        <button id="logout">退出登录</button>
      </aside>
      <main id="content">
        <p id="crumb"></p>
        <h1 id="heading"></h1>
        <p id="intro"></p>
        <section id="body"></section>
      </main>
    </div>
    <footer>
      上海如静知华信息科技有限公司 ·
      <a href="https://www.zhuatech.cn/">知华科技官网</a>
    </footer>
  </body>
</html>
